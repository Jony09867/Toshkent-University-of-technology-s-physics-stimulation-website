kind = "web"
previewPath = "/"
title = "TT Physics Lab"
description = "An Uzbek-language interactive physics laboratory for engineering students, with guided topics, live simulations, formulas, charts, and responsive controls."
version = "1.0.0"
id = "artifacts/tt-physics-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23747

[services.development]
run = "pnpm --filter @workspace/tt-physics-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tt-physics-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/tt-physics-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23747"
BASE_PATH = "/"
